<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
>
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7545FF"/>
            <stop offset="55%" stop-color="#4219DB"/>
            <stop offset="100%" stop-color="#2410A8"/>
        </linearGradient>

        <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="55%" stop-color="#F8F7FF"/>
            <stop offset="100%" stop-color="#DCD5FF"/>
        </linearGradient>

        <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#A994FF"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8"/>
        </filter>

        <clipPath id="rounded">
            <rect width="512" height="512" rx="112"/>
        </clipPath>
    </defs>

    <g clip-path="url(#rounded)">
        <!-- Background -->
        <rect width="512" height="512" fill="url(#background)"/>

        <!-- Subtle background highlight -->
        <circle
            cx="95"
            cy="75"
            r="290"
            fill="#FFFFFF"
            opacity=".07"
        />

        <!-- Logo shadow -->
        <path
            d="M104 397 V181
               C104 118 177 88 220 132
               L390 310
               V155
               C390 92 455 87 456 155
               V331
               C456 393 385 423 341 377
               L170 201
               V357
               C170 419 104 432 104 397 Z"
            fill="#10066A"
            opacity=".28"
            filter="url(#shadow)"
            transform="translate(0 12)"
        />

        <!-- Main ribbon N -->
        <path
            d="M104 397
               V181
               C104 118 177 88 220 132
               L390 310
               V155
               C390 92 456 92 456 155
               V331
               C456 393 385 423 341 377
               L170 201
               V357
               C170 419 104 432 104 397 Z"
            fill="url(#ribbon)"
        />

        <!-- Left ribbon fold -->
        <path
            d="M104 397
               V263
               C125 221 161 218 190 247
               L170 201
               V357
               C170 419 104 432 104 397 Z"
            fill="url(#fold)"
            opacity=".75"
        />

        <!-- Right ribbon fold -->
        <path
            d="M390 310
               L341 377
               C385 423 456 393 456 331
               V155
               C456 126 440 112 421 112
               V267
               C421 295 408 309 390 310 Z"
            fill="#FFFFFF"
            opacity=".18"
        />

        <!-- Highlight -->
        <path
            d="M126 181
               C126 132 177 111 212 145
               L369 310"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="5"
            stroke-linecap="round"
            opacity=".35"
        />
    </g>
</svg>
